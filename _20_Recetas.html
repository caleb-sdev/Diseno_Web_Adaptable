<!--
Crea una página de recetas
Construye una app que sea funcionalmente similar a este proyecto de ejemplo. Trata de no copiar el proyecto de ejemplo, dale tu propio estilo personal.

Objetivo: Cumplir con las historias de usuario a continuación y pasar todas las pruebas para completar el laboratorio.

Historias de usuario:

Debes tener una declaración !DOCTYPE html.
Debes tener un elemento html con el atributo lang establecido en en.
Debes tener un elemento head que contenga un elemento title con el nombre de tu receta y un elemento meta con un atributo charset establecido en UTF-8.
Debes tener un elemento body.
Debes tener solo un elemento h1 con el nombre de tu receta.
Debes tener un elemento p que introduzca la receta debajo del h1.
Debes tener un elemento h2 con el texto Ingredients para la sección de ingredientes.
Debes tener una lista desordenada (elemento ul) con al menos cuatro elementos de lista (li) que enumeren tus ingredientes debajo del primer elemento h2.
Debes tener un segundo elemento h2 con el texto Instructions para la sección de instrucciones.
Debes tener una lista ordenada (elemento ol) con al menos cuatro elementos de lista que enumeren los pasos de la receta en orden, debajo del segundo h2.
Debes tener un elemento img con un atributo src que apunte a una imagen válida y un atributo alt que describa la imagen. Puedes usar https://cdn.freecodecamp.org/curriculum/labs/recipe.jpg si quieres.

-->

<!DOCTYPE html>
<html lang="en">
<head>
  <title>Receta</title>
  <meta charset="UTF-8"></meta>
</head>
<body>
  <h1>pollo frito</h1>
  <p>casa 1</p>
  <p>casa 2</p>
  <h2>Ingredients</h2>
  <ul>
    <li>pollo</li>
    <li>harina</li>
    <li>aceite</li>
    <li>panko</li>
  </ul>  
  <h2>Instructions</h2>
  <ol>
    <li>ya</li>
    <li>que</li>
    <li>no</li>
    <li>prueba</li>
  </ol>  
  <img src="https://cdn.freecodecamp.org/curriculum/labs/recipe.jpg" alt="3 huevos">
</body>
</html>
